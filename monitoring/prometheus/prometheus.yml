global:
  scrape_interval: 15s
  scrape_timeout: 10s
  external_labels:
    monitor: crush

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Per-container metrics (CPU/RAM/network/restarts) — covers every container.
  - job_name: cadvisor
    static_configs:
      - targets: ['cadvisor:8080']

  # Host metrics (disk/memory/load).
  - job_name: node-exporter
    static_configs:
      - targets: ['node-exporter:9100']

  # Postgres instance metrics.
  - job_name: postgres
    static_configs:
      - targets: ['postgres-exporter:9187']

  # Redis metrics.
  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']
