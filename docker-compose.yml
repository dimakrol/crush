services:
  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT:-6479}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16
    ports:
      - "${PG_PORT:-5532}:5432"
    environment:
      POSTGRES_USER: whitelabel
      POSTGRES_PASSWORD: whitelabel
      POSTGRES_DB: whitelabel
    volumes:
      - pg_data:/var/lib/postgresql/data
      # The platform's `crash_pilot` database is created by the platform itself
      # on boot (ensureDatabase) — no initdb script, which would only ever run
      # on a fresh volume anyway.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whitelabel -d whitelabel"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  white-label:
    build:
      context: ./white-label
    # Container-network routing overrides win over the image's .env defaults.
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://whitelabel:whitelabel@postgres:5432/whitelabel
      LOBBY_JWT_SECRET: ${LOBBY_JWT_SECRET:-dev-lobby-secret-change-me}
      LOBBY_JWT_EXPIRES_IN: 1h
      OPERATOR_API_KEY: ${OPERATOR_API_KEY:-dev-operator-key}
      OPERATOR_SECRET: ${OPERATOR_SECRET:-dev-operator-secret-change-me}
      GAME_FRONTEND_URL: http://localhost:${FRONTEND_PORT:-5274}
      GAME_ID: crash-pilot
      LAUNCH_TOKEN_TTL_SECONDS: 60
      INITIAL_DEMO_BALANCE: 100000
      CORS_ORIGIN: http://localhost:${FRONTEND_PORT:-5274}
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: 500
      WATCHPACK_POLLING: "true"
      TSC_WATCHFILE: PriorityPollingInterval
      TSC_WATCHDIRECTORY: FixedPollingInterval
    ports:
      - "${WHITELABEL_PORT:-4200}:4000"
    volumes:
      - ./white-label:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ./platform
    # node_modules self-heal on dep changes lives in the image's
    # docker-entrypoint.sh (re-runs `npm ci` when package-lock.json changed),
    # so no command: override is needed here.
    env_file:
      - ./platform/.env
    # Container-network routing overrides (these win over env_file).
    # Everything else (JWT secret, round params) comes from the .env file above.
    environment:
      PORT: 4000
      POSTGRES_URL: postgresql://whitelabel:whitelabel@postgres:5432/crash_pilot
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:${FRONTEND_PORT:-5274}
      # Seamless-wallet client: reach the white-label over the container network.
      # OPERATOR_* must match the white-label's values (same HMAC secret).
      WALLET_API_URL: http://white-label:4000
      OPERATOR_API_KEY: ${OPERATOR_API_KEY:-dev-operator-key}
      OPERATOR_SECRET: ${OPERATOR_SECRET:-dev-operator-secret-change-me}
      GAME_ID: crash-pilot
      # Guards POST /api/admin/wallet-ops/retry (the money-outbox recovery hook).
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-admin-key}
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: 500
      WATCHPACK_POLLING: "true"
      TSC_WATCHFILE: PriorityPollingInterval
      TSC_WATCHDIRECTORY: FixedPollingInterval
    ports:
      - "${BACKEND_PORT:-4100}:4000"
    volumes:
      - ./platform:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      white-label:
        condition: service_started
    restart: unless-stopped

  backoffice:
    build:
      context: ./backoffice
    # NestJS + the Vite/react-admin client run in one process tree; only Nest's
    # port is published, the Vite dev server is reached through Nest's proxy.
    #
    # backoffice/.env is bind-mounted with the source, but process.loadEnvFile()
    # never overwrites an already-set variable — everything below wins over it.
    environment:
      PORT: 4000
      # Superuser credentials, used at boot only: they create the read-only role
      # the runtime pool then logs in as, so this service physically cannot write
      # to the game's data. Same database the platform owns.
      POSTGRES_ADMIN_URL: postgresql://whitelabel:whitelabel@postgres:5432/crash_pilot
      POSTGRES_RO_USER: backoffice_ro
      POSTGRES_RO_PASSWORD: ${BACKOFFICE_RO_PASSWORD:-backoffice_ro_dev}
      # The backoffice's own store (operator accounts + audit log). Inside the
      # bind-mounted tree, so it survives rebuilds — host path ./backoffice/data.
      SQLITE_PATH: /app/data/backoffice.db
      BACKOFFICE_JWT_SECRET: ${BACKOFFICE_JWT_SECRET:-dev-backoffice-secret-change-me}
      BACKOFFICE_JWT_EXPIRES_IN: 8h
      BACKOFFICE_ADMIN_USER: ${BACKOFFICE_ADMIN_USER:-admin}
      BACKOFFICE_ADMIN_PASSWORD: ${BACKOFFICE_ADMIN_PASSWORD:-admin}
      # Reads hit Postgres directly, but every write goes through the platform's
      # admin API — that is what keeps the money outbox the only path a balance
      # can move along. ADMIN_API_KEY must match the backend's value above.
      PLATFORM_API_URL: http://backend:4000
      ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-admin-key}
      # Vite runs in this same container, so localhost is the right address here.
      VITE_DEV_SERVER_URL: http://localhost:5175
      # The published port, which is the only one the browser knows. Vite needs
      # it to tell the HMR client where to dial back — 5175 exists only inside
      # this container.
      BACKOFFICE_PUBLIC_PORT: ${BACKOFFICE_PORT:-4300}
      STUCK_OP_MINUTES: 5
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: 500
      WATCHPACK_POLLING: "true"
      TSC_WATCHFILE: PriorityPollingInterval
      TSC_WATCHDIRECTORY: FixedPollingInterval
    ports:
      - "${BACKOFFICE_PORT:-4300}:4000"
    volumes:
      - ./backoffice:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      # `service_started` is all Compose can offer, but the boot-time schema
      # guard needs the platform's migrations to have already run against
      # crash_pilot. On a cold first start it can lose that race and exit —
      # restart: unless-stopped is what makes the stack converge anyway.
      backend:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend/crash-pilot
    # Browser-facing URLs: the browser reaches the backend via the published
    # host port, so these stay on localhost (not the internal service name).
    environment:
      VITE_API_URL: http://localhost:${BACKEND_PORT:-4100}
      VITE_SOCKET_URL: http://localhost:${BACKEND_PORT:-4100}
      # Lobby origin authorized to frame the game (CSP frame-ancestors + postMessage target).
      VITE_LOBBY_ORIGIN: http://localhost:${WHITELABEL_PORT:-4200}
    ports:
      - "${FRONTEND_PORT:-5274}:5174"
    volumes:
      - ./frontend/crash-pilot:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pg_data:
